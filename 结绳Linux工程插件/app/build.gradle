apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    buildToolsVersion "35.0.0"

    namespace "com.linux.plugin"

    defaultConfig {
        applicationId "com.linux.plugin"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    packagingOptions {
        // 禁止剥离 libtiec_shared.so 的调试符号（防止节区头损坏）
        doNotStrip "**/libtiec_shared.so"
        jniLibs {
            // minSdk<23 时 AGP 默认 useLegacyPackaging=true,会把 .so 以 Deflated 打包。
            // 结绳安装器用 available()+单次 read() 读取条目,压缩条目会读出零尾导致段头损坏。
            // 改为 STORED(未压缩)打包,使单次 read 能一次读满。
            useLegacyPackaging = false
        }
    }

    
    android.applicationVariants.all {
                variant ->
                    variant.outputs.all {
                        output -> output.outputFileName = "结绳Linux-SDL3工程插件-4.6" + ".rmx"
                    }
            }
}

dependencies {
	implementation fileTree(dir: "libs", include: ["*.jar","*.aar"])
	//implementation("cn.tiecode:tiecode-compiler:4.7.0-preview8")
    compileOnly fileTree(dir: "libs/api", include: ["*.jar","*.aar"])
}
