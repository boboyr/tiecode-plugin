apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    buildToolsVersion "35.0.0"

    namespace "com.tiecode.aarplugin"

    defaultConfig {
        applicationId "com.tiecode.aarplugin"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                output -> output.outputFileName = "结绳安卓工程aar构建插件-1.5" + ".rmx"
            }
    }
}

dependencies {
    // 宿主 API：compileOnly，运行时由结绳宿主提供（编译器 API 也在宿主里，
    // 所以本插件不打包任何编译器实现）
    compileOnly fileTree(dir: "libs/api", include: ["*.jar"])
}
