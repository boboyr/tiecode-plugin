apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    buildToolsVersion "36.0.0"

    namespace "com.scala.android"

    defaultConfig {
        applicationId "com.scala.android"
        // Scala 3.8 编译器引用了 java.lang.invoke.VarHandle，
        // 该 API 从 Android 13(API 33) 才开始提供给应用使用，所以最低就是 API 33。
        minSdkVersion 33
        targetSdkVersion 36
        versionCode 11
        versionName "1.10"
        // Scala 编译器 + 标准库展开后远超 64K 方法数，必须多 dex。
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        resources.excludes += [
            'META-INF/MANIFEST.MF',
            'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/LICENSE.md',
            'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE.md',
            'META-INF/DEPENDENCIES', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        ]
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "scala安卓工程插件-1.10" + ".rmx"
        }
    }
}

// 模板目录 → 单个 assets zip（与 tools/build-template-zip.sh 等价，保证两条构建路径一致）
tasks.register("templateZip", Zip) {
    from("src/main/assets/templates/project/scala_android_sbt")
    archiveFileName = "scala_android_sbt.zip"
    destinationDirectory = file("src/main/assets/templates/project")
}
tasks.named("preBuild").configure { dependsOn("templateZip") }

// 结绳插件工程模板 → 单个 assets zip（与 tools/build-plugin-template-zip.sh 等价）
tasks.register("pluginTemplateZip", Zip) {
    from("src/main/assets/templates/project/scala_tiecode_plugin")
    archiveFileName = "scala_tiecode_plugin.zip"
    destinationDirectory = file("src/main/assets/templates/project")
}
tasks.named("preBuild").configure { dependsOn("pluginTemplateZip") }

dependencies {
    // 宿主 API(studio-api)：compileOnly，运行时由结绳宿主提供，不打包进插件
    compileOnly fileTree(dir: "libs/api", include: ["*.jar"])
    // Scala 3 编译器与运行时：随插件一起打包，插件进程内直接调用
    implementation fileTree(dir: "libs/scala", include: ["*.jar"])
}
